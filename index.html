<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Отдых">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#FBF5E6" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#16151D" media="(prefers-color-scheme: dark)">
<meta name="color-scheme" content="light dark">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Nunito:wght@900&family=Onest:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<title>Отдых</title>
<style>
:root{
  --bg:#FBF5E6; --paper:#FFFDF7; --ink:#1D1B18; --muted:#6E685E; --track:#ECE6D8;
  --accent:#5D5BD4; --accent-soft:#C9C7F4; --pink:#EF8DB4; --yellow:#F6CB55;
  --physical:#F7A982; --emotional:#EF8DB4; --social:#F6CB55; --cognitive:#86B6F2; --creative:#93D6AE;
  --bw:2.5px; --r:26px; --line:var(--ink); --shadow:var(--ink); --on-c:#1D1B18; --accent-text:var(--accent); --glow:#FBE3A8;
  --sh:6px 6px 0 var(--shadow); --sh-s:4px 4px 0 var(--shadow);
  --sans:"Onest",-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif;
  --round:"Nunito","Onest",sans-serif; --hand:"Caveat","Onest",cursive;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink)}
body{font:17px/1.45 var(--sans);-webkit-font-smoothing:antialiased;min-height:100vh;
  padding-top:env(safe-area-inset-top);
  background:radial-gradient(120% 50% at 100% 0%, var(--glow) 0%, transparent 55%) no-repeat, var(--bg)}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
textarea,input{font:inherit;color:inherit}
.wrap{max-width:520px;margin:0 auto;padding:10px 20px calc(120px + env(safe-area-inset-bottom))}

/* ---------- header ---------- */
.bar{display:flex;align-items:center;justify-content:space-between;padding:14px 0 6px}
.brand{display:flex;align-items:center;gap:12px;font-weight:700;font-size:26px;letter-spacing:-.02em}
.logo{width:44px;height:44px;border-radius:50%;background:var(--accent);color:#fff;display:grid;place-items:center}
.logo svg{width:26px;height:26px}
.hand-link{font:700 24px/1 var(--hand);color:var(--accent-text);text-decoration:underline;text-underline-offset:4px;text-decoration-thickness:2px}

/* ---------- hero ---------- */
.hero{display:flex;align-items:center;gap:10px;margin:14px 0 6px}
.mascot{width:118px;flex:none}
.bubble{position:relative;background:var(--paper);border:var(--bw) solid var(--line);border-radius:26px;padding:14px 18px;
  box-shadow:var(--sh-s);font-size:16px;line-height:1.35;flex:1}
.bubble:before{content:"";position:absolute;left:-11px;top:50%;width:18px;height:18px;background:var(--paper);
  border-left:var(--bw) solid var(--line);border-bottom:var(--bw) solid var(--line);transform:translateY(-50%) rotate(45deg);border-radius:0 0 0 5px}
h1{font-size:46px;line-height:1;letter-spacing:-.045em;font-weight:900;margin:18px 0 0}
h1 .acc{font-family:var(--round);color:var(--accent-text);letter-spacing:-.03em;font-weight:900}
.lead{color:var(--muted);font-size:17px;margin:12px 0 0}
.pills{display:flex;gap:10px;margin-top:16px;flex-wrap:wrap}
.pill{display:inline-flex;align-items:center;gap:6px;padding:9px 18px;border:var(--bw) solid var(--line);border-radius:999px;
  background:var(--paper);font-weight:600;font-size:16px;transition:transform .1s, box-shadow .1s}
.pill:disabled{opacity:.35}
.pill.solid{background:var(--accent);color:#fff}
.pill:active:not(:disabled){transform:translate(2px,2px)}

.eyebrow{font-size:13px;font-weight:800;text-transform:uppercase;letter-spacing:.12em;margin:34px 2px 14px}

/* ---------- cards ---------- */
.card{background:var(--paper);border:var(--bw) solid var(--line);border-radius:var(--r);box-shadow:var(--sh)}
.stack{display:flex;flex-direction:column;gap:14px}
.pad{padding:18px 20px}

.type{text-align:left;width:100%;padding:16px 18px;background:var(--paper);border:var(--bw) solid var(--line);border-radius:var(--r);
  transition:transform .15s, box-shadow .15s, background .15s;cursor:pointer}
.type .row{display:flex;align-items:center;gap:12px}
.swatch{width:16px;height:16px;border-radius:50%;flex:none;background:var(--c);border:2px solid var(--line)}
.type .name{font-weight:800;font-size:19px;letter-spacing:-.01em;flex:1}
.tick{width:28px;height:28px;border-radius:50%;border:var(--bw) solid var(--line);display:grid;place-items:center;flex:none;background:var(--paper)}
.tick svg{width:15px;height:15px;opacity:0}
.type .sym{color:var(--muted);font-size:15px;margin:6px 0 0 28px;line-height:1.4}
.type.on{background:var(--c);color:var(--on-c);box-shadow:var(--sh);transform:translate(-2px,-2px)}
.type.on .sym{color:var(--on-c)}
.type.on .swatch{border-color:var(--on-c)}
.type.on .tick{border-color:var(--on-c)}
.type.on .tick{background:var(--on-c);color:#fff}
.type.on .tick svg{opacity:1}

.scale{display:none;margin:14px 0 2px 28px}
.type.on .scale{display:block}
.scale-l{display:flex;justify-content:space-between;font:700 19px/1 var(--hand);margin-bottom:8px}
.seg{display:grid;grid-template-columns:repeat(5,1fr);gap:7px}
.seg button{height:40px;border-radius:999px;background:var(--paper);border:2px solid var(--line);font-weight:800;font-size:16px}
.seg button.on{background:var(--ink);color:var(--paper)}
.type.on .seg button{background:#FFFDF7;border-color:var(--on-c);color:var(--on-c)}
.type.on .seg button.on{background:var(--on-c);color:#fff}

/* ---------- recs ---------- */
.group-h{display:flex;align-items:center;gap:10px;padding:18px 20px 2px}
.group-h b{font-size:18px;font-weight:800;letter-spacing:-.01em}
.hint{font:700 21px/1.15 var(--hand);color:var(--accent-text);padding:6px 20px 12px 46px}
.rec{border-top:2px dashed var(--line);padding:14px 20px}
.rec-main{display:flex;align-items:center;gap:14px;width:100%;text-align:left}
.box{width:28px;height:28px;border-radius:9px;border:var(--bw) solid var(--line);display:grid;place-items:center;flex:none;background:var(--paper);transition:background .12s}
.box svg{width:16px;height:16px;opacity:0}
.rec.done .box{background:var(--accent);color:#fff}
.rec.done .box svg{opacity:1}
.rec-t{flex:1;font-weight:500}
.del{width:30px;height:30px;border-radius:50%;border:2px solid var(--line);font-size:13px;font-weight:700;flex:none}
.chips{display:flex;gap:8px;margin:12px 0 0 42px;flex-wrap:wrap}
.chip{padding:6px 12px;border-radius:999px;border:2px solid var(--line);background:var(--paper);font-size:14px;font-weight:600}
.chip.on.yes{background:var(--accent);color:#fff}
.chip.on.partly{background:var(--yellow);color:var(--on-c)}
.chip.on.no{background:var(--ink);color:var(--paper)}
.add{border-top:2px dashed var(--line);padding:10px 20px 14px}
.add input{width:100%;border:0;background:transparent;padding:6px 0;font:700 22px/1.2 var(--hand);color:var(--accent-text);outline:none}
.add input::placeholder{color:var(--accent-text);opacity:.8}

textarea{width:100%;border:0;background:transparent;resize:none;min-height:70px;outline:none;font-size:17px}
textarea::placeholder{color:var(--muted)}

/* ---------- notes ---------- */
.note{border:var(--bw) solid var(--line);border-radius:var(--r);box-shadow:var(--sh);padding:22px 22px}
.note h3{margin:0 0 8px;font-size:22px;line-height:1.15;font-weight:800;letter-spacing:-.02em}
.note p{margin:0;font-size:17px}
.note.warn{background:var(--pink);color:var(--on-c)}
.note.all{background:var(--yellow);color:var(--on-c)}
.note .pill{margin-top:16px;background:#FFFDF7;color:var(--on-c);border-color:var(--on-c)}
.note{border-color:var(--line)}
.dashed{border:var(--bw) dashed var(--line);border-radius:24px;padding:18px 20px;display:flex;gap:16px;align-items:center}
.dashed .ic{width:52px;height:52px;border-radius:50%;background:var(--ink);color:var(--bg);display:grid;place-items:center;flex:none}
.dashed .ic svg{width:26px;height:26px}
.dashed b{display:block;font-size:17px;margin-bottom:2px}
.dashed .hand{font:700 23px/1.15 var(--hand);color:var(--accent-text)}

/* details, tips, phq, flags */
.more{margin:8px 0 0 42px}
.more summary{font:700 20px/1.2 var(--hand);color:var(--accent-text);cursor:pointer;list-style:none;display:inline-block}
.more summary::-webkit-details-marker{display:none}
.more div{white-space:pre-line;font-size:15px;color:var(--muted);margin-top:6px;line-height:1.5}
.tip{margin:0 20px 12px 46px;display:inline-block;padding:5px 12px;border:2px dashed var(--line);border-radius:999px;font-size:14px;font-weight:600}
.phq{margin-top:16px;padding-top:14px;border-top:2px dashed var(--on-c)}
.phq p{font-size:16px}
.phq-q{font-weight:700;margin:14px 0 2px}
.note .chip{background:#FFFDF7;color:var(--on-c);border-color:var(--on-c);font-size:13px;padding:5px 10px}
.note .chip.on{background:var(--on-c);color:#fff}
.phq-r{margin-top:12px!important;padding-top:12px;border-top:2px dashed var(--on-c)}
.flag-l{font-size:14px!important;margin-top:12px!important}
.flag-l button{text-decoration:underline;font-weight:700;color:inherit}
.flags ul{margin:0;padding-left:18px}
.flags li{margin:6px 0;font-size:15px;line-height:1.4}

/* rating prompt */
.ask .rec:first-of-type{border-top:0}
.ask .chips{margin-left:0}

/* ---------- history ---------- */
.heat{display:grid;grid-template-columns:auto repeat(14,1fr);gap:4px;align-items:center}
.heat .lbl{font-size:13px;font-weight:700;padding-right:6px;white-space:nowrap}
.cell{aspect-ratio:1;border-radius:6px;background:var(--track)}
.cell.f{border:1.5px solid var(--line)}
.dayn{font-size:11px;color:var(--muted);text-align:center;font-weight:600}
.dayn.today{color:var(--accent-text);font-weight:900}
.stat{padding:14px 0;border-top:2px dashed var(--line)}
.stat:first-of-type{border-top:0;padding-top:6px}
.stat-top{display:flex;justify-content:space-between;gap:12px;font-size:16px;font-weight:500}
.stat-top span:last-child{font-weight:800;white-space:nowrap}
.bar-t{height:12px;border-radius:999px;background:var(--track);margin-top:9px;overflow:hidden}
.bar-t i{display:block;height:100%;border-radius:999px;background:var(--c);border-right:2px solid var(--line)}
.bar-t i[style*="width:0%"]{border:0}
.few{opacity:.5}
.foot{font:700 21px/1.2 var(--hand);color:var(--accent-text);margin:14px 4px 0}
.empty{text-align:center;padding:8px 10px}
.empty .hand{font:700 24px/1.2 var(--hand);color:var(--accent-text)}

/* ---------- settings sheet ---------- */
.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;z-index:20}
.sheet{position:fixed;left:0;right:0;bottom:0;max-width:520px;margin:0 auto;background:var(--bg);
  border:var(--bw) solid var(--line);border-bottom:0;border-radius:30px 30px 0 0;
  padding:22px 20px calc(26px + env(safe-area-inset-bottom));transform:translateY(105%);transition:transform .28s ease;z-index:21;max-height:90vh;overflow:auto}
.sheet{visibility:hidden}
.sheet.open{transform:none;visibility:visible}
.sheet-bg.open{display:block}
.sheet h2{margin:0;font-size:34px;font-weight:900;letter-spacing:-.04em}
.set-row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:13px 0;border-top:2px dashed var(--line);font-size:16px;font-weight:500}
.set-row:first-child{border-top:0;padding-top:0}
.set-row:last-child{padding-bottom:0}
.stepper{display:flex;align-items:center;gap:10px}
.stepper button{width:36px;height:36px;border-radius:50%;border:2px solid var(--line);background:var(--paper);font-size:20px;font-weight:700;line-height:1}
.stepper b{min-width:24px;text-align:center;font-size:18px;font-weight:900}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:16px;border-radius:999px;border:var(--bw) solid var(--line);
  background:var(--accent);color:#fff;font-weight:800;font-size:17px;box-shadow:var(--sh-s);transition:transform .1s, box-shadow .1s}
.btn:active{transform:translate(4px,4px);box-shadow:0 0 0 var(--shadow)}
.btn.ghost{background:var(--paper);color:var(--ink)}
.small{font-size:14px;color:var(--muted);line-height:1.45;margin:10px 4px 0}

/* ---------- tab bar ---------- */
.tabs{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(14px + env(safe-area-inset-bottom));display:flex;gap:4px;
  padding:5px;background:var(--paper);border:var(--bw) solid var(--line);border-radius:999px;box-shadow:var(--sh-s);z-index:10}
.tab{display:flex;align-items:center;gap:8px;padding:11px 16px;border-radius:999px;font-weight:700;font-size:16px;white-space:nowrap}
.tab .lbl{display:none}
.tab.on .lbl{display:inline}
.tab.on{padding:11px 20px}
.tab svg{width:20px;height:20px}
.tab.on{background:var(--accent);color:#fff}

@media (prefers-color-scheme: dark){
  :root{
    --bg:#16151D; --paper:#22202C; --ink:#F2ECE0; --muted:#A39DB0; --track:#34313F;
    --line:#F2ECE0; --shadow:#6E6BEA; --accent:#6462E0; --accent-text:#A9A7FF; --glow:#2B2856;
  }
  .type.on{box-shadow:6px 6px 0 var(--line)}
  .note{box-shadow:6px 6px 0 var(--line)}
  .mascot .shade{fill:#3B3A9E}
}

@media (prefers-reduced-motion: reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<nav class="tabs">
  <button class="tab" data-tab="day"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2.5v2M12 19.5v2M2.5 12h2M19.5 12h2M5.3 5.3l1.4 1.4M17.3 17.3l1.4 1.4M5.3 18.7l1.4-1.4M17.3 6.7l1.4-1.4"/></svg><span class="lbl">День</span></button>
  <button class="tab" data-tab="today"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg><span class="lbl">Вечер</span></button>
  <button class="tab" data-tab="history"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M5 20V11M12 20V5M19 20v-6"/></svg><span class="lbl">Что помогает</span></button>
</nav>
<div class="sheet-bg" id="sheetBg"></div>
<div class="sheet" id="sheet"></div>
<input type="file" id="importFile" accept="application/json,.json" hidden>

<script>
'use strict';
/* ---------- Контент: подкаст «Познай самого себя» + исследования ---------- */
const WRITE_TOPICS = `Сколько хочется — хоть три строчки. Можно взять любую тему:
• что сегодня задело и почему
• что я чувствую и где это в теле
• чего мне сейчас не хватает
• что я могу отпустить до завтра
• что сегодня получилось, пусть мелочь
• что бы я сказал другу на моём месте`;
const STEAM = `Разрядка, которая успокаивает тело, а не разгоняет:
• напрячь все мышцы изо всех сил на 5 секунд и резко отпустить, 3–5 раз
• встряхнуться всем телом, как собака после воды, 1–2 минуты
• громко выдохнуть со звуком «ха-а-а» несколько раз
• скомкать и сжать полотенце или подушку, потом отпустить`;
const ANY = { id:'any', name:'При любой усталости', color:'var(--accent-soft)',
  hint:'начни с этого — так голова отпускает работу.',
  recs:[['close','Закрыть работу: записать дела на завтра','Выпиши хвосты на завтра, закрой рабочие вкладки и почту. Если мысль о работе вернётся — скажи себе: «это уже в списке».'],
        ['breath','5 минут дышать с длинным выдохом','Два коротких вдоха носом подряд и длинный медленный выдох ртом. Спокойно повторять около 5 минут.']] };
const TYPES = [
  { id:'physical', short:'Физ.', name:'Физическая', color:'var(--physical)',
    sym:'Сонливость, вялость, тяжесть, мышечное напряжение, скованность, головная боль',
    hint:'недосып — нужен сон. засиделся — мягкое движение, а не диван.',
    recs:[['regular','Ложиться в одно и то же время'],['sleep','Лечь спать раньше'],['shower','Тёплый душ за 1–2 часа до сна'],['walk','Неспешная прогулка'],['stretch','Лёгкая растяжка'],['massage','Самомассаж или массажный мяч']] },
  { id:'emotional', short:'Эмоц.', name:'Эмоциональная', color:'var(--emotional)',
    sym:'Раздражительность или замкнутость, легко расплакаться, «всё, больше не могу» из‑за мелочи, страх, что выдохся',
    hint:'не отвлекай себя развлечениями — дай эмоции место.',
    recs:[['name','Назвать эмоцию одним словом'],['write','Выписать мысли о дне', WRITE_TOPICS],['talk','Попросить близкого выслушать, потом сменить тему'],['kind','Сказать себе: «мне тяжело, и это нормально»'],['steam','Выпустить пар без разрушений', STEAM],['silence','Побыть в тишине']] },
  { id:'social', short:'Соц.', name:'Социальная', color:'var(--social)',
    sym:'Не хочется никого видеть, отвечать на сообщения, рассказывать, как прошёл день',
    hint:'важно не сколько людей, а какой контакт сейчас нужен.',
    recs:[['alone','Побыть одному'],['chats','Режим «Не беспокоить» на вечер'],['boundary','Сказать «сегодня не могу, давай завтра»'],['quietwalk','Молча погулять с близким']] },
  { id:'cognitive', short:'Умств.', name:'Умственная', color:'var(--cognitive)',
    sym:'Перечитываешь абзац по три раза, ошибки в простом, нет идей — «ничего не могу придумать»',
    hint:'устаёшь от переключений. нужно что-то одно и без работы.',
    recs:[['nature','20–30 минут в парке или у деревьев'],['noscreen','Без работы и тревожных новостей на экране'],['nofeed','Без ленты соцсетей (один ролик — можно)'],['monotone','Монотонное дело без подкаста (готовка, уборка)'],['hands','Сделать что-то руками'],['read','Почитать не по работе'],['play','Порисовать, пазл или игра — без цели'],['permission','Разрешить себе сегодня ничего не придумывать']] },
];
const DAY = { id:'day', name:'Днём', color:'var(--social)', recs:[
  ['light','10–20 минут дневного света утром','Выйти на улицу или постоять у открытого окна в первые часы после подъёма. Утренний свет помогает вечером легче засыпать.'],
  ['water','Стакан воды утром, бутылка — на столе','Даже лёгкое обезвоживание ухудшает внимание и настроение. Проще всего пить, когда вода на виду.'],
  ['coffee','Кофе — только до 12:00','Кофеин действует больше 6 часов и сокращает сон, даже когда этого не замечаешь.'],
  ['breaks','Перерыв каждые 60–90 минут','Встать, пройтись, посмотреть вдаль 5–10 минут. После тяжёлой задачи — перерыв подольше.'],
  ['batch','Почта и мессенджеры — 3 раза в день','Проверять в выбранное время, а не по каждому уведомлению. Так меньше переключений и стресса.'],
  ['focus','Одна задача за раз','На время рабочего блока закрыть лишние вкладки и чаты. Переключения утомляют сильнее самой работы.'],
  ['lunch','Обед не за компьютером','Хотя бы 20 минут без экрана и рабочих разговоров.'],
  ['stop','Решить утром, во сколько закончишь','Время окончания, назначенное заранее, проще соблюсти вечером.'],
]};
const PHRASES = ['Отдых наполняет тело энергией.','Отдых снимает нервное напряжение.','Отдых удерживает фокус.','Отдых рождает лучшие идеи.','Отдых укрепляет иммунитет.','Отдых предотвращает истощение.','Отдых помогает усваивать информацию.','Отдых дарит эмоциональное равновесие.','Отдых заботится о сердце.','Отдых дарит глубокий сон.','Отдых проясняет мысли.','Отдых укрепляет отношения с близкими.','Отдых возвращает желание действовать и достигать целей.','Отдых возвращает точность.','Отдых улучшает самочувствие.','Отдых создаёт баланс в жизни.','Отдых помогает слышать себя.','Отдых улучшает настроение.','Отдых дарит лёгкость в теле.','Отдых возвращает бодрость.','Отдых наполняет силы смыслом.','Отдых перезагружает весь организм.','Отдых сохраняет здоровье.','Отдых расширяет границы мышления.','Отдых зажигает искру вдохновения.','Отдых освобождает место для нового.','Отдых делает взгляд свежим.','Отдых упрощает сложные задачи.','Отдых возвращает радость жизни.','Отдых дарит ощущение гармонии.','Отдых возвращает внутренний покой.','Отдых вдохновляет на перемены.','Отдых возвращает вкус к деталям.','Отдых делает день насыщеннее.','Отдых открывает новые перспективные пути.','Отдых возвращает кайф от любимого дела.','Отдых превращает усилие в удовольствие.'];
const LEGACY = { 'cognitive.move':'Простая физическая активность' };
const T = Object.fromEntries(TYPES.map(t => [t.id, t]));
const RATE = [['yes','Помогло'],['partly','Частично'],['no','Нет']];
const SCORE = { yes:1, partly:.5, no:0 };

/* ---------- Хранение ---------- */
const KEY = 'otdyh.v1';
const DEFAULTS = { version:2, days:{}, custom:{}, settings:{ windowDays:14, minDays:10, minIntensity:3 }, dismissed:{}, lastExport:null, phq:null, phqDraft:{} };
let S = load();
function load(){
  try{ const raw = localStorage.getItem(KEY); if(raw){ const d = JSON.parse(raw); return migrate({ ...DEFAULTS, ...d, settings:{ ...DEFAULTS.settings, ...(d.settings||{}) } }); } }catch(e){}
  return JSON.parse(JSON.stringify(DEFAULTS));
}
// «Творческая» стала частью «Умственной»: переносим старые записи
function migrate(s){
  const map = { aimless:'play', puzzle:'play', read:'read', hands:'hands', permission:'permission' };
  for(const d of Object.values(s.days||{})){
    if(d.types && d.types.creative != null){ d.types.cognitive = Math.max(d.types.cognitive||0, d.types.creative); delete d.types.creative; }
    for(const key of Object.keys(d.actions||{})){
      if(!key.startsWith('creative.')) continue;
      const rest = key.slice(9), nk = 'cognitive.' + (rest.startsWith('c.') ? rest : (map[rest]||rest));
      if(!d.actions[nk]) d.actions[nk] = d.actions[key];
      delete d.actions[key];
    }
  }
  if(s.custom && s.custom.creative){ s.custom.cognitive = [...(s.custom.cognitive||[]), ...s.custom.creative]; delete s.custom.creative; }
  s.phqDraft ||= {}; s.version = 2;
  return s;
}
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){} }
try{ navigator.storage && navigator.storage.persist && navigator.storage.persist(); }catch(e){}

/* ---------- Даты (до 5 утра — это ещё вчерашний вечер) ---------- */
const pad = n => String(n).padStart(2,'0');
const keyOf = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parse = k => { const [y,m,d] = k.split('-').map(Number); return new Date(y, m-1, d, 12); };
const addDays = (k, n) => { const d = parse(k); d.setDate(d.getDate()+n); return keyOf(d); };
const logicalToday = () => { const d = new Date(); d.setHours(d.getHours()-5); return keyOf(d); };
const WD = ['воскресенье','понедельник','вторник','среда','четверг','пятница','суббота'];
const MO = ['января','февраля','марта','апреля','мая','июня','июля','августа','сентября','октября','ноября','декабря'];
const human = k => { const d = parse(k); return `${d.getDate()} ${MO[d.getMonth()]}`; };
const relName = k => { const t = logicalToday(); if(k===t) return 'Сегодня'; if(k===addDays(t,-1)) return 'Вчера'; const w = WD[parse(k).getDay()]; return w[0].toUpperCase()+w.slice(1); };

/* ---------- Модель ---------- */
const day = k => S.days[k] || (S.days[k] = { types:{}, actions:{}, skip:'' });
const peek = k => S.days[k];
const src = id => id === 'any' ? ANY : id === 'day' ? DAY : T[id];
const recsOf = id => [...src(id).recs.map(([rid, text, more]) => ({ key:`${id}.${rid}`, text, more })), ...(S.custom[id]||[]).map(c => ({ key:`${id}.c.${c.id}`, text:c.text, custom:true }))];
const active = (d, key) => { const id = key.split('.')[0]; return id === 'any' ? Object.keys(d.types).length > 0 : !!d.types[id]; };
const recText = key => { const [id] = key.split('.'); const r = src(id) ? recsOf(id).find(r => r.key === key) : null; return r ? r.text : (LEGACY[key] || '—'); };
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const dailyPhrase = k => { const n = Math.floor(parse(k).getTime()/864e5); return PHRASES[((n % PHRASES.length) + PHRASES.length) % PHRASES.length]; };
const plural = (n,a,b,c) => { const m=n%10, h=n%100; return m===1&&h!==11?a:(m>=2&&m<=4&&(h<10||h>=20))?b:c; };

function unratedBefore(k){
  for(let i=1;i<=3;i++){
    const pk = addDays(k,-i), d = peek(pk);
    if(!d) continue;
    const list = Object.entries(d.actions).filter(([key,a]) => a.done && !a.helped && active(d, key));
    if(list.length) return { k:pk, list };
    if(Object.keys(d.types).length) return null;
  }
  return null;
}

function signals(){
  const t = logicalToday(), { windowDays:w, minDays:m, minIntensity:mi } = S.settings, out = [];
  const count = (id, span) => { let n = 0; for(let i=0;i<span;i++){ const d = peek(addDays(t,-i)); if(d && (d.types[id]||0) >= mi) n++; } return n; };
  for(const type of TYPES){
    if(S.dismissed[type.id] && S.dismissed[type.id] > t) continue;
    const n = count(type.id, w); if(n < m) continue;
    let rated = 0, score = 0;
    for(let i=0;i<w;i++){ const d = peek(addDays(t,-i)); if(!d) continue;
      for(const [key,a] of Object.entries(d.actions)) if(key.startsWith(type.id+'.') && a.done && a.helped){ rated++; score += SCORE[a.helped]; } }
    const sig = { type, n, w, rated, score, level:'main' };
    if(type.id === 'physical'){ const n28 = count('physical', 28); if(n28 >= 18 && (!rated || score/rated < .5)){ sig.level = 'doctor'; sig.n28 = n28; } }
    out.push(sig);
  }
  return out;
}

const PHQ_Q = ['Мало интереса или удовольствия от дел', 'Подавленность, грусть или безнадёжность'];
const PHQ_A = ['ни разу','несколько дней','больше половины дней','почти каждый день'];
function phqBlock(){
  const t = logicalToday();
  if(S.phq && addDays(S.phq.date, 14) > t){
    return S.phq.score >= 3
      ? `<p class="phq-r"><b>Две проверки: ${S.phq.score} из 6.</b> Обсуди это на ближайшей сессии с психотерапевтом. Если она нескоро — запишись раньше.</p>`
      : `<p class="phq-r"><b>Две проверки: ${S.phq.score} из 6</b> — на что-то большее не похоже. Но если так продолжится, расскажи терапевту.</p>`;
  }
  return `<div class="phq"><p><b>Две короткие проверки.</b> За последние 2 недели как часто тебя беспокоило:</p>
    ${PHQ_Q.map((q,i) => `<div class="phq-q">${q}</div><div class="chips" style="margin-left:0">${PHQ_A.map((a,v) => `<button class="chip ${S.phqDraft['q'+i]===v?'on':''}" data-act="phq" data-q="${i}" data-v="${v}">${a}</button>`).join('')}</div>`).join('')}</div>`;
}

function warnCard(s, withPhq){
  const mi = S.settings.minIntensity, pct = s.rated ? Math.round(s.score/s.rated*100) : null;
  const help = s.rated >= 3 && s.score/s.rated < .5 ? ` Отдых помогал редко (в ${pct}% случаев) — похоже, дело не только в отдыхе.`
             : s.rated ? ` Отдых помогал в ${pct}% оценённых случаев.` : '';
  let title, text;
  if(s.level === 'doctor'){
    title = 'Пора к терапевту';
    text = `Физическая усталость держится почти месяц (${s.n28} из 28 дней), и отдых её не снимает. Запишись к терапевту — например, проверить общий анализ крови, щитовидку (ТТГ) и биохимию.`;
  } else if(s.type.id === 'physical'){
    title = `Физическая усталость: ${s.n} из ${s.w} дней`;
    text = `Сила ${mi}+.${help} Если так продолжится ещё 1–2 недели — сходи к терапевту.`;
  } else {
    title = `${s.type.name} усталость: ${s.n} из ${s.w} дней`;
    text = `Сила ${mi}+, устойчивого улучшения нет.${help}` + (s.type.id === 'emotional'
      ? ' Если к этому добавились цинизм к работе и чувство, что ничего не получается, — это похоже на выгорание. Тогда нужен не только отдых, но и меньше нагрузки.'
      : ' Стоит обсудить это с психотерапевтом.');
  }
  return `<div class="note warn" style="margin-top:28px"><h3>${title}</h3><p>${text}</p>${withPhq ? phqBlock() : ''}
    <button class="pill" data-act="dismiss" data-id="${s.type.id}">Понятно, скрыть на неделю</button>
    <p class="flag-l">Симптомы, при которых идти сразу, — в <button data-act="settings">настройках</button>.</p></div>`;
}

function stats(){
  const res = {};
  for(const d of Object.values(S.days)){
    for(const [key,a] of Object.entries(d.actions)){
      const id = key.split('.')[0];
      if(!a.done || !active(d, key)) continue;
      const s = (res[id] ||= {})[key] ||= { tried:0, rated:0, score:0 };
      s.tried++; if(a.helped){ s.rated++; s.score += SCORE[a.helped]; }
    }
  }
  return res;
}

/* ---------- Графика ---------- */
const I = {
  tick:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>',
  moon:'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M19.5 14.6A7.6 7.6 0 0 1 9.4 4.5a7.6 7.6 0 1 0 10.1 10.1z"/></svg>',
  heart:'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 20.5s-7.5-4.4-7.5-10A4.3 4.3 0 0 1 12 7.6a4.3 4.3 0 0 1 7.5 2.9c0 5.6-7.5 10-7.5 10z"/></svg>',
};
// Свой маскот: облачко

    ? '<circle cx="47" cy="70" r="4.2" fill="#1D1B18"/><circle cx="73" cy="70" r="4.2" fill="#1D1B18"/><path d="M40 63l11-5M80 63l-11-5" stroke="#1D1B18" stroke-width="3" stroke-linecap="round"/>'

/* ---------- Отрисовка ---------- */
let tab = new Date().getHours() < 15 ? 'day' : 'today', view = logicalToday();
const app = document.getElementById('app');
const header = () => `<div class="bar"><div class="brand"><span class="logo">${I.moon}</span>отдых</div>
  <button class="hand-link" data-act="settings">настройки ↓</button></div>`;

function render(){
  document.querySelectorAll('.tab').forEach(b => b.classList.toggle('on', b.dataset.tab === tab));
  app.innerHTML = header() + (tab === 'today' ? renderToday() : tab === 'day' ? renderDay() : renderHistory());
}

function chips(k, key, a){
  return `<div class="chips">${RATE.map(([v,l]) => `<button class="chip ${v} ${a.helped===v?'on':''}" data-act="rate" data-day="${k}" data-key="${key}" data-v="${v}">${l}</button>`).join('')}</div>`;
}

function bubbleText(k, d, sig){
  if(k !== logicalToday()) return `это ${human(k)}. можно дополнить запись.`;
  if(sig.length) return 'кажется, усталость не проходит. посмотри ниже ↓';
  return dailyPhrase(k);
}

function renderDay(){
  const t = logicalToday(), d = peek(t) || {}, m = d.morning || {};
  let h = `<div class="hero">${mascot('happy')}<div class="bubble">${dailyPhrase(t)}</div></div>
    <h1>Днём —<br><span class="acc">береги силы.</span></h1>
    <p class="lead">Если весь день работать без перерывов, вечерний отдых работает слабее. Вот что помогает меньше уставать.</p>
    <div class="eyebrow">Чтобы меньше устать к вечеру</div><div class="card" style="--c:var(--social)">`;
  recsOf('day').forEach((r, i) => {
    h += `<div class="rec ${m[r.key]?'done':''}" style="${i === 0 ? 'border-top:0' : ''}"><div class="rec-main"><button class="rec-main" data-act="mdone" data-key="${r.key}"><span class="box">${I.tick}</span><span class="rec-t">${esc(r.text)}</span></button>${r.custom?`<button class="del" data-act="delc" data-key="${r.key}" aria-label="Удалить">✕</button>`:''}</div>
      ${r.more ? `<details class="more"><summary>зачем ↓</summary><div>${esc(r.more)}</div></details>` : ''}</div>`;
  });
  h += `<div class="add"><input data-act="addc" data-id="day" placeholder="+ добавить своё" enterkeyhint="done"></div></div>
    <p class="foot">не нужно всё сразу — выбери одно-два на сегодня.</p>`;
  return h;
}

function renderToday(){
  const t = logicalToday(), k = view, d = peek(k) || { types:{}, actions:{}, skip:'' };
  const sel = TYPES.filter(x => d.types[x.id]);
  const sig = k === t ? signals() : [];
  const u = unratedBefore(k);

  let h = `<div class="hero">${mascot(sig.length ? 'worry' : 'happy')}<div class="bubble">${bubbleText(k, d, sig)}</div></div>
    <h1>${relName(k)},<br><span class="acc">${human(k)}.</span></h1>
    <div class="pills"><button class="pill" data-act="prev">← раньше</button>
    <button class="pill" data-act="next" ${k>=t?'disabled':''}>позже →</button>
    ${k!==t?'<button class="pill solid" data-act="tonight">сегодня</button>':''}</div>`;

  let phqShown = false;
  for(const s of sig){
    const withPhq = !phqShown && (s.type.id === 'emotional' || s.type.id === 'social');
    if(withPhq) phqShown = true;
    h += warnCard(s, withPhq);
  }

  if(u){
    h += `<div class="eyebrow">${u.k===addDays(k,-1)?'Вчера':human(u.k)} ты сделал. Помогло?</div><div class="card ask pad" style="padding-top:4px;padding-bottom:6px">
      ${u.list.map(([key,a]) => `<div class="rec" style="padding-left:0;padding-right:0"><div style="font-weight:600">${esc(recText(key))}</div>${chips(u.k,key,a)}</div>`).join('')}</div>`;
  }

  h += `<div class="eyebrow">От чего устал?</div><div class="stack">`;
  for(const x of TYPES){
    const v = d.types[x.id];
    h += `<div class="type ${v?'on':''}" style="--c:${x.color}" data-act="type" data-id="${x.id}" role="button">
      <div class="row"><span class="swatch"></span><span class="name">${x.name}</span><span class="tick">${I.tick}</span></div>
      <div class="sym">${x.sym}</div>
      <div class="scale"><div class="scale-l"><span>чуть-чуть</span><span>очень сильно</span></div>
      <div class="seg">${[1,2,3,4,5].map(n => `<button class="${v===n?'on':''}" data-act="lvl" data-id="${x.id}" data-n="${n}">${n}</button>`).join('')}</div></div></div>`;
  }
  h += `</div>`;

  if(sel.length === TYPES.length){
    h += `<div class="note all" style="margin-top:22px"><h3>Всё сразу</h3><p>Похоже, нужен не какой-то вид отдыха, а снижение нагрузки — или несколько дней без попытки быть эффективным.</p></div>`;
  }

  if(sel.length){
    h += `<div class="eyebrow">Что сделал для восстановления</div><div class="stack" style="gap:18px">`;
    for(const x of [ANY, ...sel]){
      h += `<div class="card" style="--c:${x.color}"><div class="group-h"><span class="swatch"></span><b>${x.name}</b></div><div class="hint">${x.hint}</div>${x.tip?`<div class="tip">☕ ${x.tip}</div>`:''}`;
      for(const r of recsOf(x.id)){
        const a = d.actions[r.key] || {};
        h += `<div class="rec ${a.done?'done':''}"><div class="rec-main"><button class="rec-main" data-act="done" data-key="${r.key}"><span class="box">${I.tick}</span><span class="rec-t">${esc(r.text)}</span></button>${r.custom?`<button class="del" data-act="delc" data-key="${r.key}" aria-label="Удалить">✕</button>`:''}</div>
          ${r.more ? `<details class="more"><summary>${x.id==='emotional'&&r.key.endsWith('.write')?'о чём писать ↓':'как ↓'}</summary><div>${esc(r.more)}</div></details>` : ''}
          ${a.done ? chips(k, r.key, a) : ''}</div>`;
      }
      h += `<div class="add"><input data-act="addc" data-id="${x.id}" placeholder="+ добавить своё" enterkeyhint="done"></div></div>`;
    }
    h += `</div>`;
  } else {
    h += `<div class="dashed" style="margin-top:22px"><span class="ic">${I.heart}</span><div><b>Рекомендации появятся здесь</b><span class="hand">отметь, что устало, — и я подскажу →</span></div></div>`;
  }

  h += `<div class="eyebrow">Что я могу сегодня не делать?</div><div class="card pad"><textarea data-act="skip" rows="2" placeholder="Необязательно. Одна строка — уже хорошо.">${esc(d.skip||'')}</textarea></div>`;
  return h;
}

function renderHistory(){
  const t = logicalToday(), days = [...Array(14)].map((_,i) => addDays(t, i-13));
  let h = `<h1 style="margin-top:22px">Что <span class="acc">помогает.</span></h1>
    <p class="lead">Твоя личная карта восстановления. Никакая «ванга» её не составит — только пробы и ошибки.</p>`;

  h += `<div class="eyebrow">Последние 14 дней</div><div class="card pad"><div class="heat">`;
  for(const x of TYPES){
    h += `<span class="lbl">${x.short}</span>`;
    for(const k of days){ const v = (peek(k)||{types:{}}).types[x.id]; h += `<button class="cell ${v?'f':''}" data-act="open" data-day="${k}" style="${v?`background:${x.color};opacity:${.5+v*.1}`:''}" aria-label="${human(k)}"></button>`; }
  }
  h += `<span></span>${days.map(k => `<span class="dayn ${k===t?'today':''}">${parse(k).getDate()}</span>`).join('')}</div></div>`;

  const week = {}; for(let i=0;i<7;i++){ const d = peek(addDays(t,-i)); if(d) for(const id in d.types) week[id] = (week[id]||0)+1; }
  const top = Object.entries(week).sort((a,b) => b[1]-a[1]);
  if(top.length){
    h += `<div class="dashed" style="margin-top:22px"><span class="ic">${I.moon}</span><div><b>За неделю чаще всего: ${top.slice(0,2).map(([id,n]) => `${T[id].name.toLowerCase()} (${n} дн.)`).join(', ')}</b>
      <span class="hand">от этой нагрузки ты продолжаешь уставать, даже когда отдыхаешь?</span></div></div>`;
  }

  const st = stats(); let any = false;
  h += `<div class="eyebrow">Помогает лично тебе</div><div class="stack" style="gap:18px">`;
  for(const x of [ANY, ...TYPES]){
    const rows = Object.entries(st[x.id]||{}).sort((a,b) => (b[1].rated?b[1].score/b[1].rated:-1) - (a[1].rated?a[1].score/a[1].rated:-1));
    if(!rows.length) continue; any = true;
    h += `<div class="card pad" style="--c:${x.color}"><div class="group-h" style="padding:0 0 8px"><span class="swatch"></span><b>${x.name}</b></div>`;
    for(const [key,s] of rows){
      const p = s.rated ? s.score/s.rated : 0;
      h += `<div class="stat ${s.rated<3?'few':''}"><div class="stat-top"><span>${esc(recText(key))}</span><span>${s.rated?`${Math.round(p*100)}%`:'—'}</span></div>
        <div class="bar-t"><i style="width:${Math.round(p*100)}%"></i></div>
        <div class="small" style="margin:6px 0 0">${s.rated?`${s.rated} ${plural(s.rated,'оценка','оценки','оценок')}`:'не оценено'}${s.tried>s.rated?` · сделано ${s.tried}`:''}</div></div>`;
    }
    h += `</div>`;
  }
  h += `</div>`;
  if(!any) h += `<div class="dashed"><span class="ic">${I.heart}</span><div><b>Пока пусто</b><span class="hand">через пару недель тут будет видно, что восстанавливает именно тебя</span></div></div>`;
  else h += `<p class="foot">бледные строки — меньше 3 оценок, выводы делать рано. «частично» = половина.</p>`;
  return h;
}

/* ---------- Настройки ---------- */
const sheet = document.getElementById('sheet'), sheetBg = document.getElementById('sheetBg');
function openSettings(){
  const s = S.settings;
  const step = (f,v) => `<div class="stepper"><button data-act="st" data-f="${f}" data-d="-1">−</button><b>${v}</b><button data-act="st" data-f="${f}" data-d="1">+</button></div>`;
  sheet.innerHTML = `<div style="display:flex;justify-content:space-between;align-items:center"><h2>Настройки</h2><button class="hand-link" data-act="close">готово</button></div>
    <div class="eyebrow" style="margin-top:22px">Когда предупреждать</div>
    <div class="card pad"><div class="set-row"><span>Сила усталости от</span>${step('minIntensity', s.minIntensity)}</div>
    <div class="set-row"><span>Дней с такой усталостью</span>${step('minDays', s.minDays)}</div>
    <div class="set-row"><span>За последние, дней</span>${step('windowDays', s.windowDays)}</div></div>
    <p class="small">Сейчас: если один тип усталости силой ${s.minIntensity}+ отмечен ${s.minDays} из ${s.windowDays} дней — появится предупреждение. Это не медицинская норма; порог лучше согласовать с врачом или терапевтом.</p>
    <div class="eyebrow">Данные</div>
    <div class="stack"><button class="btn" data-act="export">Сохранить резервную копию →</button>
    <button class="btn ghost" data-act="import">Восстановить из копии</button></div>
    <p class="small">Всё хранится только на этом телефоне. Если удалить иконку с экрана «Домой», данные пропадут. Последняя копия: <b>${S.lastExport ? human(S.lastExport) : 'ещё не было'}</b>.</p>
    <div class="eyebrow">Когда обращаться сразу</div>
    <div class="card pad flags"><ul>
      <li><b>Мысли о самоубийстве или о том, чтобы навредить себе</b> — в тот же день: к врачу, психотерапевту или 112.</li>
      <li>Похудание без причины, температура, ночная потливость, увеличенные лимфоузлы.</li>
      <li>Новая сильная головная боль, нарушение зрения, онемение или слабость в руке или ноге.</li>
      <li>Боль в груди, одышка, обмороки.</li>
      <li>Храп с остановками дыхания во сне.</li>
      <li>Не получается работать или заботиться о себе.</li>
    </ul><p class="small" style="margin:10px 0 0">В Португалии: 112 — экстренно, SNS 24 (808 24 24 24) — медицинская линия.</p></div>
    <div class="eyebrow">О приложении</div>
    <p class="small" style="margin-top:0">Типы усталости — практическая карта из подкаста «Познай самого себя» (Анна Иванникова). Рекомендации и пороги сверены с исследованиями по восстановлению и клиническими руководствами (NICE, AAFP, PHQ-2), но приложение не заменяет врача. Записей: ${Object.keys(S.days).length}.</p>`;
  sheet.classList.add('open'); sheetBg.classList.add('open');
}
function closeSettings(){ sheet.classList.remove('open'); sheetBg.classList.remove('open'); }
sheetBg.onclick = closeSettings;

async function doExport(){
  const name = `otdyh-${logicalToday()}.json`, json = JSON.stringify(S, null, 1);
  const file = new File([json], name, { type:'application/json' });
  S.lastExport = logicalToday(); save();
  try{ if(navigator.canShare && navigator.canShare({ files:[file] })){ await navigator.share({ files:[file], title:name }); openSettings(); return; } }catch(e){ if(e.name==='AbortError') return; }
  const a = document.createElement('a'); a.href = URL.createObjectURL(file); a.download = name; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  openSettings();
}
document.getElementById('importFile').onchange = async e => {
  const f = e.target.files[0]; if(!f) return;
  try{
    const d = JSON.parse(await f.text());
    if(!d || typeof d.days !== 'object') throw 0;
    if(!confirm(`Заменить текущие данные копией (${Object.keys(d.days).length} записей)?`)) return;
    S = migrate({ ...DEFAULTS, ...d, settings:{ ...DEFAULTS.settings, ...(d.settings||{}) } }); save(); closeSettings(); render();
  }catch(_){ alert('Не похоже на файл резервной копии.'); }
  e.target.value = '';
};

/* ---------- События ---------- */
const LIM = { minIntensity:[1,5], minDays:[1,60], windowDays:[3,60] };
document.addEventListener('click', e => {
  const tb = e.target.closest('.tab'); if(tb){ tab = tb.dataset.tab; if(tab==='today') view = logicalToday(); render(); scrollTo(0,0); return; }
  const el = e.target.closest('[data-act]'); if(!el) return;
  const act = el.dataset.act, k = view;
  switch(act){
    case 'prev': view = addDays(view,-1); render(); break;
    case 'next': if(view < logicalToday()){ view = addDays(view,1); render(); } break;
    case 'tonight': view = logicalToday(); render(); break;
    case 'mdone': { const d = day(logicalToday()), m = d.morning ||= {}; if(m[el.dataset.key]) delete m[el.dataset.key]; else m[el.dataset.key] = true; save(); render(); break; }
    case 'type': {
      if(e.target.closest('.seg')) return;
      const d = day(k), id = el.dataset.id;
      if(d.types[id]) delete d.types[id]; else d.types[id] = 3;
      save(); render(); break; }
    case 'lvl': { day(k).types[el.dataset.id] = +el.dataset.n; save(); render(); break; }
    case 'done': { const d = day(k), a = d.actions[el.dataset.key] ||= {}; a.done = !a.done; if(!a.done) delete d.actions[el.dataset.key]; save(); render(); break; }
    case 'rate': { const d = day(el.dataset.day), a = d.actions[el.dataset.key] ||= { done:true }; a.helped = a.helped === el.dataset.v ? null : el.dataset.v; save(); render(); break; }
    case 'delc': { const [id,,cid] = el.dataset.key.split('.'); S.custom[id] = (S.custom[id]||[]).filter(c => c.id !== cid); save(); render(); break; }
    case 'phq': {
      S.phqDraft['q'+el.dataset.q] = +el.dataset.v;
      if(S.phqDraft.q0 != null && S.phqDraft.q1 != null){ S.phq = { date:logicalToday(), score:S.phqDraft.q0 + S.phqDraft.q1 }; S.phqDraft = {}; }
      save(); render(); break; }
    case 'dismiss': { S.dismissed[el.dataset.id] = addDays(logicalToday(), 7); save(); render(); break; }
    case 'open': { view = el.dataset.day; tab = 'today'; render(); scrollTo(0,0); break; }
    case 'settings': openSettings(); break;
    case 'close': closeSettings(); break;
    case 'st': { const f = el.dataset.f, [lo,hi] = LIM[f]; S.settings[f] = Math.min(hi, Math.max(lo, S.settings[f] + +el.dataset.d));
      if(S.settings.minDays > S.settings.windowDays) S.settings.minDays = S.settings.windowDays; save(); openSettings(); render(); break; }
    case 'export': doExport(); break;
    case 'import': document.getElementById('importFile').click(); break;
  }
});
document.addEventListener('input', e => {
  if(e.target.dataset.act === 'skip'){ day(view).skip = e.target.value; save(); }
});
document.addEventListener('keydown', e => {
  if(e.target.dataset.act === 'addc' && e.key === 'Enter'){ e.preventDefault(); e.target.blur(); }
});
document.addEventListener('focusout', e => {
  if(e.target.dataset.act !== 'addc') return;
  const v = e.target.value.trim(); if(!v) return;
  const id = e.target.dataset.id; (S.custom[id] ||= []).push({ id: Date.now().toString(36), text:v });
  save(); render();
});
// Приложение оставили открытым на ночь — при возвращении показать новый день.
let openedOn = logicalToday();
document.addEventListener('visibilitychange', () => {
  if(document.hidden) return;
  const t = logicalToday();
  if(t !== openedOn){ if(view === openedOn) view = t; openedOn = t; render(); }
});

render();
if(document.fonts) document.fonts.ready.then(render);
if('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js');
</script>
